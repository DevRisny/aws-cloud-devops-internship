name: CI/CD — test & deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "module-03-s3-static-website/**"
      - "module-05-lambda-serverless/**"
      - "assets/**"
      - "module-06-cicd/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  # Public endpoints (not secrets). The deploy hook only ever deploys the current head of main.
  DEPLOY_HOOK_URL: https://reosh3sjgyprvxeqka7khd7wfq0waivn.lambda-url.ap-southeast-2.on.aws/
  SKILLMATCH_API: https://b03b4vxstj.execute-api.ap-southeast-2.amazonaws.com
  PORTFOLIO_URL: https://d7x1ojq6uq6wa.cloudfront.net

jobs:
  test:
    name: Test & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Unit tests — SkillMatch Lambda
        run: |
          pip install --quiet pytest
          pytest -q module-05-lambda-serverless/tests
      - name: Validate HTML files
        run: |
          python - <<'PY'
          import glob, html.parser, sys
          bad = 0
          for f in glob.glob("module-0*/**/*.html", recursive=True):
              p = html.parser.HTMLParser(); p.feed(open(f, encoding="utf-8").read()); p.close()
              print("ok  ", f)
          sys.exit(bad)
          PY
      - name: Lint shell scripts
        run: |
          for s in module-0*/*.sh; do bash -n "$s" && echo "ok   $s"; done

  deploy:
    name: Deploy to AWS (keyless deploy hook)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy hook (Lambda verifies this is the head of main)
        run: |
          code=$(curl -sS -o report.json -w '%{http_code}' -X POST "$DEPLOY_HOOK_URL" \
                 -H 'content-type: application/json' -d '{"sha":"${{ github.sha }}"}')
          cat report.json; echo
          test "$code" = "200"
      - name: Smoke test live endpoints
        run: |
          curl -fsS "$SKILLMATCH_API/health"; echo
          curl -fsS -o /dev/null -w "portfolio HTTP %{http_code}\n" "$PORTFOLIO_URL"
      - name: Summary
        run: |
          {
            echo "## ✅ Deployed commit \`${GITHUB_SHA::7}\` to AWS ($AWS_REGION)"
            echo "- Portfolio (S3 + CloudFront): $PORTFOLIO_URL"
            echo "- SkillMatch Lambda: new version published"
            echo '```json'; cat report.json; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
